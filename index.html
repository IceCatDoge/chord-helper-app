<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chord Helper</title>
    <script src="https://cdn.jsdelivr.net/npm/svguitar@2.5.1/dist/svguitar.umd.js"></script>
    <style>
        /* BASE & THEMES */
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f8f9fa;
            --surface: #ffffff;
            --border: #dddddd;
        }

        body.theme-dark {
            --primary: #ecf0f1;
            --accent: #ffcc00;
            --bg: #1a1a1a;
            --surface: #2d2d2d;
            --border: #444444;
        }

        body.theme-sunburst {
            --primary: #f8f1e1;
            --accent: #d95c14;
            --bg: radial-gradient(circle at center, #eab034 0%, #b83b10 45%, #1a0f0c 90%);
            --surface: rgba(26, 15, 12, 0.75);
            --border: #f8f1e1;
        }

        body.theme-neon {
            --primary: #ffffff;
            --accent: #00ffcc;
            --bg: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --surface: rgba(0,0,0,0.4);
            --border: #00ffcc;
        }

        body.theme-high-contrast {
            --primary: #000000;
            --accent: #0000ff;
            --bg: #ffffff;
            --surface: #ffffff;
            --border: #000000;
        }

        /* LYRICS STUDIO STYLES */
        .lyric-line {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 15px;
            align-items: flex-end;
        }

        .chord-pair {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .chord-label {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: -2px;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 1;
        }

            .chord-label.verified {
                color: var(--accent);
            }

            .chord-label.missing {
                color: #e74c3c;
                cursor: pointer;
                border: 1px dashed #e74c3c;
                background: rgba(231, 76, 60, 0.1);
                transition: background 0.2s;
            }

                .chord-label.missing:hover {
                    background: #e74c3c;
                    color: white;
                }

        .lyric-text {
            font-size: 16px;
            white-space: pre; /* Preserves the exact spaces typed */
        }

        /* STRUCTURAL STYLES */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--primary);
            min-height: 100vh;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            transition: background 0.3s, color 0.3s;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border: 1px solid var(--border);
            transition: background 0.3s;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        button, select, #variant-input {
            background-color: var(--surface);
            border: 2px solid var(--accent);
            color: var(--primary);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            transition: background-color 0.2s, color 0.2s;
        }

        #variant-input {
            width: 140px;
        }

        button:hover, button.active {
            background-color: var(--accent);
            color: var(--surface);
        }

        .tuner-btn {
            font-size: 14px;
            padding: 6px 10px;
            border-color: var(--border);
            color: var(--primary);
        }

        #chord-diagram {
            width: 100%;
            max-width: 320px;
            height: 350px;
            margin: 0 auto;
        }

        .pos-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: -10px;
            margin-bottom: 15px;
        }

            .pos-controls button {
                padding: 4px 12px;
                font-size: 18px;
            }
    </style>
</head>
<body>

    <div class="header-row">
        <h1 style="margin: 0;">Chord Helper</h1>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button id="open-library-btn" style="padding: 6px 12px; font-size: 14px;">Library</button>
            <select id="capo-selector" style="padding: 6px 10px; font-size: 14px; border-radius: 6px; border: 2px solid var(--accent); background: var(--surface); color: var(--primary);">
                <option value="0">No Capo</option>
                <option value="1">Capo 1</option>
                <option value="2">Capo 2</option>
                <option value="3">Capo 3</option>
                <option value="4">Capo 4</option>
                <option value="5">Capo 5</option>
                <option value="6">Capo 6</option>
                <option value="7">Capo 7</option>
            </select>
            <select id="theme-selector">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="sunburst">Sunburst</option>
                <option value="neon">Neon</option>
                <option value="high-contrast">High Contrast</option>
            </select>
        </div>
    </div>

    <div class="section">
        <div class="controls-row">
            <!-- ROOT BUTTONS -->
            <div class="btn-group" id="root-buttons">
                <button class="root-btn active">A</button>
                <button class="root-btn">B</button>
                <button class="root-btn">C</button>
                <button class="root-btn">D</button>
                <button class="root-btn">E</button>
                <button class="root-btn">F</button>
                <button class="root-btn">G</button>
            </div>

            <div class="btn-group" id="accidental-buttons">
                <button class="acc-btn active" data-acc="">♮</button>
                <button class="acc-btn" data-acc="#">♯</button>
                <button class="acc-btn" data-acc="b">♭</button>
            </div>

            <!-- VARIANT SEARCH INPUT -->
            <input type="text" id="variant-input" list="variant-list" style="text-transform: lowercase" placeholder="e.g. m, 7, mmaj7" value="">    <!-- Enforce lower case to fix phone/tablet input field default behaviour -->
            <datalist id="variant-list">
                <!-- Options will be injected here dynamically -->
            </datalist>
        </div>

        <!-- Explicit HTML title to prevent SVG overlap bugs -->
        <h2 id="main-chord-title" style="margin-top: 0; margin-bottom: 10px; font-size: 22px; height: 26px;"></h2>
        <div id="chord-diagram"></div>

        <!-- POSITION TOGGLE -->
        <div class="pos-controls" id="pos-controls" style="display: none;">
            <button id="prev-pos">&lt;</button>
            <span id="pos-indicator">Pos 1 / 1</span>
            <button id="next-pos">&gt;</button>
        </div>

        <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; align-items: center;">
            <button id="strum-btn" style="width: 120px; display: none;">Strum</button>
            <select id="chord-duration-select" style="display: none; padding: 6px; border-radius: 4px; border: 2px solid var(--accent); background: var(--surface); color: var(--primary); font-weight: bold;">
                <option value="1">1 Beat</option>
                <option value="2">2 Beats</option>
                <option value="3">3 Beats</option>
                <option value="4" selected>4 Beats</option>
                <option value="6">6 Beats</option>
                <option value="8">8 Beats</option>
            </select>
            <button id="add-chord-btn" style="width: 140px; display: none;">➕ Add to Block</button>
            <button id="add-rest-btn" style="width: 130px; display: none; background: transparent; color: var(--accent); border-color: var(--accent);">Add Rest</button>
        </div>
    </div>

    <!-- MINI TUNER -->
    <div class="section">
        <h3 style="margin-top:0; font-size:16px;">Reference Tuner</h3>
        <div class="btn-group">
            <button class="tuner-btn" onclick="toggleTuner(this, 82.41)">E</button>
            <button class="tuner-btn" onclick="toggleTuner(this, 110.00)">A</button>
            <button class="tuner-btn" onclick="toggleTuner(this, 146.83)">D</button>
            <button class="tuner-btn" onclick="toggleTuner(this, 196.00)">G</button>
            <button class="tuner-btn" onclick="toggleTuner(this, 246.94)">B</button>
            <button class="tuner-btn" onclick="toggleTuner(this, 329.63)">e</button>
        </div>
    </div>

    <!-- EDITOR VIEW (Hidden by default) -->
    <div id="editor-view" class="section" style="display: none; min-height: 400px; text-align: left;">
        <div class="header-row" style="margin-bottom: 20px;">
            <button id="close-editor-btn" style="padding: 6px 12px; font-size: 14px;">⬅ Back</button>
            <h2 style="margin: 0; font-size: 18px;">Save Block</h2>
            <button id="save-block-btn" style="background-color: var(--accent); color: white; padding: 6px 12px; font-size: 14px;">Save</button>
        </div>
        <input type="text" id="block-name-input" placeholder="e.g., Verse 1, Chorus..." style="width: 100%; box-sizing: border-box; margin-bottom: 15px; font-size: 16px; padding: 10px; border-radius: 6px; border: 2px solid var(--border); background: var(--surface); color: var(--primary); outline: none;">
        <div id="draft-list" style="display: flex; flex-direction: column; gap: 8px;">
            <!-- Draft items injected here -->
        </div>

        <button id="clear-draft-btn" style="margin-top: 20px; width: 100%; background: transparent; color: #ffcc00; border-color: #ffcc00;">Clear Draft</button>
    </div>

    <!-- LIBRARY VIEW (Hidden by default) -->
    <div id="library-view" class="section" style="display: none; min-height: 400px; text-align: left;">
        <div class="header-row" style="margin-bottom: 20px;">
            <button id="close-library-btn" style="padding: 6px 12px; font-size: 14px;">⬅ Back</button>
            <div style="display: flex; gap: 10px;">
                <button id="tab-blocks" class="active" style="background: var(--accent); color: white; padding: 6px 12px; font-size: 14px; border: none; border-radius: 4px;">Blocks</button>
                <button id="tab-songs" style="background: var(--surface); color: var(--primary); padding: 6px 12px; font-size: 14px; border: 1px solid var(--border); border-radius: 4px;">Songs</button>
            </div>
            <button id="export-backup-btn" style="padding: 6px 12px; font-size: 14px; background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; font-weight: bold;">Back up</button>
            <!-- Invisible file input for the JSON backup -->
            <input type="file" id="import-backup-file" accept=".json" style="display: none;" />
            <!-- New Restore Button -->
            <button id="import-backup-btn" style="padding: 6px 12px; font-size: 14px; background: transparent; border: 1px solid var(--primary); color: var(--primary); border-radius: 4px; font-weight: bold;">Load Lib</button>
        </div>

        <div id="library-blocks-container">
            <div id="library-list" style="display: flex; flex-direction: column; gap: 12px;">
                <!-- Saved blocks get injected here -->
            </div>
        </div>

        <div id="library-songs-container" style="display: none;">
            <button id="create-song-btn" style="width: 100%; padding: 10px; margin-bottom: 15px; background: var(--accent); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold;">Create New Song</button>
            <div id="library-songs-list" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>
    </div>

    <!-- SONG EDITOR VIEW (Hidden by default) -->
    <div id="song-editor-view" class="section" style="display: none; min-height: 400px; text-align: left;">
        <div class="header-row" style="margin-bottom: 20px;">
            <button id="cancel-song-btn" style="padding: 6px 12px; font-size: 14px;">Cancel</button>
            <h2 style="margin: 0; font-size: 18px;">Song Assembler</h2>
            <div style="display: flex; gap: 10px;">
                <button id="open-lyrics-btn" style="background-color: transparent; color: var(--accent); border-color: var(--accent); padding: 6px 12px; font-size: 14px;">Lyrics</button>
                <button id="save-song-btn" style="background-color: var(--accent); color: white; padding: 6px 12px; font-size: 14px;">Save</button>
            </div>
        </div>
        <input type="text" id="song-name-input" placeholder="Song Name (e.g. Wonderwall)" style="width: 100%; box-sizing: border-box; margin-bottom: 15px; font-size: 16px; padding: 10px; border-radius: 6px; border: 2px solid var(--border); background: var(--surface); color: var(--primary); outline: none;">

        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <select id="song-block-select" style="flex: 1; padding: 10px; border-radius: 6px; border: 2px solid var(--border); background: var(--surface); color: var(--primary); font-size: 14px;"></select>
            <button id="add-block-to-song-btn" style="padding: 0 15px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold;">Add Block</button>
        </div>

        <div id="song-draft-list" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;"></div>
    </div>

    <!-- LYRICS STUDIO VIEW (Hidden by default) -->
    <div id="lyrics-studio-view" class="section" style="display: none; min-height: 400px; text-align: left;">
        <div class="header-row" style="margin-bottom: 20px;">
            <button id="close-lyrics-btn" style="padding: 6px 12px; font-size: 14px;">⬅ Back to Song</button>
            <h2 style="margin: 0; font-size: 18px;">Lyrics Studio</h2>
            <button id="export-lyrics-txt-btn" style="padding: 6px 12px; font-size: 14px; background: transparent; border: 1px solid var(--primary); color: var(--primary);">Export TXT</button>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button id="tab-napkin" class="active" style="flex: 1; padding: 8px; font-size: 14px; background: var(--accent); color: white; border: none;">The Napkin (Draft)</button>
            <button id="tab-studio" style="flex: 1; padding: 8px; font-size: 14px; background: var(--surface); color: var(--primary); border: 1px solid var(--border);">The Studio (Render)</button>
        </div>

        <!-- The Napkin (Raw Text) -->
        <textarea id="lyric-textarea" placeholder="Type lyrics here... use brackets for chords!\n\nExample:\n[G]Hello dark[D]ness my old [Em]friend" style="width: 100%; height: 350px; box-sizing: border-box; padding: 15px; font-family: monospace; font-size: 16px; border-radius: 6px; border: 2px solid var(--border); background: var(--bg); color: var(--primary); outline: none; resize: vertical;"></textarea>

        <!-- The Studio (Rendered Output) -->
        <div id="lyric-render-area" style="display: none; width: 100%; min-height: 350px; box-sizing: border-box; padding: 15px; border-radius: 6px; border: 2px solid var(--border); background: var(--bg); color: var(--primary);"></div>
    </div>

    <!-- PERFORMANCE VIEW (Hidden by default) -->
    <div id="performance-view" class="section" style="display: none; min-height: 400px; text-align: left; position: relative;">
        <div class="header-row" style="margin-bottom: 20px;">
            <button id="close-performance-btn" style="padding: 6px 12px; font-size: 14px;">⬅ Library</button>
            <h2 id="performance-title" style="margin: 0; font-size: 18px;">Live View</h2>
            <div style="width: 85px;"></div>
        </div>

        <!-- AUTOPLAY CONTROL BAR -->
        <div id="autoplay-controls" style="display: flex; gap: 10px; justify-content: center; align-items: center; padding: 12px; background: var(--bg); border: 2px solid var(--border); border-radius: 8px; margin-bottom: 15px; flex-wrap: wrap;">
            <!-- Tone Selector -->
            <div style="display: flex; align-items: center; gap: 5px;">
                <label style="font-size: 14px; font-weight: bold;">Tone:</label>
                <select id="instrument-select" style="padding: 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--primary); outline: none;">
                    <option value="acoustic">Acoustic Gtr</option>
                    <option value="piano">Piano</option>
                    <option value="metal">Distortion Gtr</option>
                    <option value="harpsichord">Harpsichord</option>
                    <option value="strings">Orchestral Strings</option>
                </select>
            </div>
            <!-- Strum Style Selector -->
            <div style="display: flex; align-items: center; gap: 5px;">
                <label style="font-size: 14px; font-weight: bold;">Style:</label>
                <select id="strum-pattern-select" style="padding: 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--primary); outline: none;">
                    <option value="down">Downstroke</option>
                    <option value="up">Upstroke (Ska)</option>
                    <option value="arp">Arpeggio</option>
                    <option value="chop">Chop (Staccato)</option>
                </select>
            </div>
            <div style="display: flex; align-items: center; gap: 5px;">
                <label style="font-size: 14px; font-weight: bold;">BPM:</label>
                <input type="number" id="tempo-input" value="120" min="40" max="240" style="width: 60px; padding: 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--primary); outline: none;">
            </div>
            <div style="display: flex; align-items: center; gap: 5px;">
                <label style="font-size: 14px; font-weight: bold;">Beat:</label>
                <select id="time-sig-select" style="padding: 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--primary); outline: none;">
                    <option value="4">4/4</option>
                    <option value="3">3/4</option>
                    <option value="6">6/8</option>
                </select>
            </div>
            <button id="toggle-audio-btn" style="padding: 6px 12px; font-size: 14px; background: transparent; border: 1px solid var(--border); color: var(--primary); border-radius: 4px;">Metronome: OFF</button>
            <button id="toggle-strum-audio-btn" style="padding: 6px 12px; font-size: 14px; background: transparent; border: 1px solid var(--border); color: var(--primary); border-radius: 4px;">Strum: OFF</button>
            <button id="play-pause-btn" style="padding: 6px 20px; font-size: 14px; background: var(--accent); color: white; border: none; border-radius: 4px; font-weight: bold;">Play</button>
            <button id="reset-focus-btn" style="padding: 6px 12px; font-size: 14px; background: transparent; border: 1px solid var(--border); color: var(--primary); border-radius: 4px;">Reset</button>
        </div>

        <p style="text-align: center; font-size: 14px; opacity: 0.8; margin-top: 0; margin-bottom: 20px; pointer-events: none;">Tap anywhere in the background to advance focus manually.</p>

        <!-- Horizontal Grid Container -->
        <div id="performance-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; justify-items: center;">
            <!-- Chords injected here -->
        </div>
    </div>

    <!-- BOTTOM DRAFT BAR -->
    <div id="draft-nav-bar" style="position: fixed; bottom: -100px; left: 0; right: 0; background: var(--surface); padding: 15px; box-shadow: 0 -4px 15px rgba(0,0,0,0.15); transition: bottom 0.3s ease-in-out; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid var(--accent); z-index: 1000; max-width: 800px; margin: 0 auto; box-sizing: border-box;">
        <span style="font-weight: bold; font-size: 16px;"><span id="draft-count" style="color: var(--accent);">0</span> Chords in Draft</span>
        <button id="view-draft-btn" style="background-color: var(--accent); color: white; border-color: var(--accent);">Edit Block</button>
    </div>

    <script>
        // --- DYNAMIC CHORD DATABASE ---
        let chordDB = {}; // Start with an empty object

        // --- FETCH AND ADAPT DATA ---
        async function loadChordDatabase() {
            const diagramContainer = document.getElementById('chord-diagram');
            diagramContainer.innerHTML = '<p style="color: #888; margin-top: 50%;">Loading chord database...</p>';

            try {
                // Fetch the main guitar.json from the tombatossals repo via jsDelivr
                const response = await fetch('https://cdn.jsdelivr.net/gh/tombatossals/chords-db@master/lib/guitar.json');
                const rawData = await response.json();

                // Loop directly over the keys in the chords object (e.g., "C", "Csharp")
                for (const internalKey in rawData.chords) {
                    const variations = rawData.chords[internalKey];

                    // Safety check to skip empty entries
                    if (!variations || variations.length === 0) continue;

                    // The database stores the true, readable root note (e.g., "C#") inside the chord data itself
                    const rootKey = variations[0].key;

                    if (!chordDB[rootKey]) {
                        chordDB[rootKey] = {}; // Initialize the root note
                    }

                    variations.forEach(chordObj => {
                        const variantName = chordObj.suffix;

                        const positions = chordObj.positions.map(pos => {
                            const fretsArray = Array.isArray(pos.frets) ? pos.frets : pos.frets.split('');
                            return {
                                // Save the translated string
                                frets: fretsArray.map(f => (f === -1 || f === 'x' || f === 'X') ? 'x' : f).join(' '),
                                // Grab the starting fret number (fallback to 1)
                                baseFret: pos.baseFret || 1
                            };
                        });

                        chordDB[rootKey][variantName] = positions;
                    });
                }

                // Populate the dropdown menu dynamically
                updateVariantList('A');
                renderChord();

            } catch (error) {
                console.error("Error loading chords:", error);
                diagramContainer.innerHTML = '<p style="color: red; margin-top: 50%;">Failed to load database. Check console.</p>';
            }
        }

        // Helper to update the datalist dynamically based on available chords
        function updateVariantList(rootNote) {
            const datalist = document.getElementById('variant-list');
            datalist.innerHTML = '';

            if (!chordDB[rootNote]) return;

            const variants = Object.keys(chordDB[rootNote]).sort();

            variants.forEach(variant => {
                const option = document.createElement('option');
                option.value = variant;
                datalist.appendChild(option);
            });

            // Ensure the input value is valid, otherwise reset
            const variantInput = document.getElementById('variant-input');
            let intendedVariant = variantInput.value.trim() === '' ? 'major' : variantInput.value.trim();

            if (!chordDB[rootNote][intendedVariant]) {
                intendedVariant = variants.includes('major') ? 'major' : variants[0];
            }
            currentVariant = intendedVariant;
            variantInput.value = currentVariant === 'major' ? '' : currentVariant;
        }

        function updateRootSelection() {
            let targetPitch = selectedBaseRoot + selectedAccidental;

            // Map common enharmonics to what the database actually uses
            const enharmonics = { 'A#': 'Bb', 'Bb': 'A#', 'C#': 'Db', 'Db': 'C#', 'D#': 'Eb', 'Eb': 'D#', 'E#': 'F', 'Fb': 'E', 'F#': 'Gb', 'Gb': 'F#', 'G#': 'Ab', 'Ab': 'G#', 'B#': 'C', 'Cb': 'B' };

            // 1. Transpose the target pitch down by the capo fret to find the physical SHAPE needed
            let shapeTarget = targetPitch;
            if (currentCapo > 0) {
                shapeTarget = transposeNote(targetPitch, -currentCapo);
            }

            // 2. Resolve enharmonics for the database lookup
            if (chordDB[shapeTarget]) {
                currentRoot = shapeTarget;
            } else if (enharmonics[shapeTarget] && chordDB[enharmonics[shapeTarget]]) {
                currentRoot = enharmonics[shapeTarget];
            } else {
                currentRoot = shapeTarget; // Fallback, will show "Not in database"
            }

            // 3. Save the active shape for drafting/display purposes
            activeShapeRoot = currentRoot;
            currentPosIndex = 0;

        function parseChordString(fretStr) {
            const frets = fretStr.split(' ');
            const fingers = [];

            frets.forEach((fret, index) => {
                const stringNum = 6 - index; // Map index 0 to guitar string 6 (low E)
                const val = fret.toLowerCase() === 'x' ? 'x' : parseInt(fret, 10);
                fingers.push([stringNum, val]);

        function transposeNote(note, semitones) {
            const enharmonics = { 'Db': 'C#', 'Eb': 'D#', 'Gb': 'F#', 'Ab': 'G#', 'Bb': 'A#' };
            let n = enharmonics[note] || note;
            let idx = chromaticMap.indexOf(n);
            if (idx === -1) return note; // Fallback if format is unexpected

            let newIdx = (idx + semitones) % 12;
            if (newIdx < 0) newIdx += 12; // Handle negative wrapping
            return chromaticMap[newIdx];
        }

        // Distortion curve math generator for the Metal tone
        function makeDistortionCurve(amount) {
            let k = typeof amount === 'number' ? amount : 50;
            let n_samples = 44100;
            let curve = new Float32Array(n_samples);
            let deg = Math.PI / 180;
            for (let i = 0; i < n_samples; ++i) {
                let x = i * 2 / n_samples - 1;
                curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
            }
            return curve;
        }

        // Modular Strum & Pattern Engine
        function playStrum(fingers, baseFret, capo) {
            initAudio();
            const now = audioCtx.currentTime;
            const bFret = baseFret || 1;

            // Check selected instrument & pattern (with safe fallbacks)
            const instSelect = document.getElementById('instrument-select');
            const instrument = instSelect ? instSelect.value : 'acoustic';

            const patternSelect = document.getElementById('strum-pattern-select');
            const pattern = patternSelect ? patternSelect.value : 'down';

            // Master volume control (metal needs a limiter so it doesn't clip badly)
            const masterStrumGain = audioCtx.createGain();
            masterStrumGain.gain.value = instrument === 'metal' ? 0.3 : 0.8;
            masterStrumGain.connect(audioCtx.destination);

            // Setup Distortion Node if needed
            let distortionNode = null;
            if (instrument === 'metal') {
                distortionNode = audioCtx.createWaveShaper();
                distortionNode.curve = makeDistortionCurve(400); // Heavy crunch
                distortionNode.oversample = '4x';
                distortionNode.connect(masterStrumGain);
            }

            // PATTERN LOGIC: Determine string striking order
            let sortedFingers = [...fingers];
            if (pattern === 'up') {
                // Upstroke: High strings (1) to Low strings (6)
                sortedFingers.sort((a, b) => a[0] - b[0]);
            } else {
                // Downstroke/Arp/Chop: Low strings (6) to High strings (1)
                sortedFingers.sort((a, b) => b[0] - a[0]);
            }

            // PATTERN LOGIC: Calculate delays and sustain
            let delayOffset = 0;
            let stepDelay = (instrument === 'piano') ? 0.01 : 0.04; // Default strum speed

            if (pattern === 'arp') {
                stepDelay = 0.15; // Slow rolling fingerpick
            } else if (pattern === 'chop') {
                stepDelay = 0.0; // All notes hit exactly at once
            }

            sortedFingers.forEach(([string, fret]) => {
                if (fret !== 'x') {
                    const absoluteFret = fret === 0 ? capo : (bFret + fret - 1 + capo);
                    const freq = openStrings[string] * Math.pow(2, absoluteFret / 12);

                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    // THE BUG FIX: Actually assigning the frequency to the oscillator!
                    osc.frequency.setValueAtTime(freq, now + delayOffset);

                    // Modify decay length for staccato "Chop" playing
                    let sustain = 2.5;
                    if (pattern === 'chop') {
                        sustain = 0.15; // Extremely short, muted decay
                    } else if (instrument === 'piano') {
                        sustain = 3.0;
                    }

                    // Instrument waveforms and envelopes
                    if (instrument === 'piano') {
                        osc.type = 'sine';
                        gain.gain.setValueAtTime(0, now + delayOffset);
                        gain.gain.linearRampToValueAtTime(0.6, now + delayOffset + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + delayOffset + sustain);
                    } else if (instrument === 'metal') {
                        osc.type = 'sawtooth';
                        gain.gain.setValueAtTime(0, now + delayOffset);
                        gain.gain.linearRampToValueAtTime(0.5, now + delayOffset + 0.05);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + delayOffset + (pattern === 'chop' ? sustain : 1.5));
                    } else if (instrument === 'harpsichord') {
                        osc.type = 'sawtooth';
                        gain.gain.setValueAtTime(0, now + delayOffset);
                        gain.gain.linearRampToValueAtTime(0.4, now + delayOffset + 0.01);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + delayOffset + 1.2);
                    } else if (instrument === 'strings') {
                        osc.type = 'sawtooth';
                        gain.gain.setValueAtTime(0, now + delayOffset);
                        // Needs some re-touch
                        gain.gain.linearRampToValueAtTime(0.3, now + delayOffset + 0.4);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + delayOffset + sustain + 1.5);
                    } else {
                        osc.type = 'triangle';
                        gain.gain.setValueAtTime(0, now + delayOffset);
                        gain.gain.linearRampToValueAtTime(0.4, now + delayOffset + 0.05);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + delayOffset + sustain);
                    }

                    osc.connect(gain);

                    // Route through distortion if active
                    if (distortionNode) {
                        gain.connect(distortionNode);
                    } else {
                        gain.connect(masterStrumGain);
                    }

                    osc.start(now + delayOffset);
                    osc.stop(now + delayOffset + sustain + 2.0); // Buffer before strict engine shutoff, original value :0.5 (before strings)

                    delayOffset += stepDelay;
                }
            });
        }

        // The Parser
        function renderStudioLyrics(rawText) {
            const container = document.getElementById('lyric-render-area');
            container.innerHTML = '';

            // Gather all chords currently in the song sequence for validation
            const activeRoots = new Set();
            const savedBlocks = JSON.parse(localStorage.getItem('chordBlocks') || '[]');
            currentSongDraft.forEach(blockId => {
                const block = savedBlocks.find(b => b.id === blockId);
                if (block) {
                    block.chords.forEach(c => {
                        const displayVariant = c.variant === 'major' ? '' : c.variant;
                        activeRoots.add(`${c.root} ${displayVariant}`.trim());
                    });
                }
            });

            const lines = rawText.split('\n');
            lines.forEach(line => {
                if (line.trim() === '') {
                    container.appendChild(document.createElement('br'));
                    return;
                }

                const lineDiv = document.createElement('div');
                lineDiv.className = 'lyric-line';

                // Split by brackets
                let segments = line.split(/\[(.*?)\]/g);

                // Text before the first chord
                if (segments[0] !== '') {
                    const pair = document.createElement('span');
                    pair.className = 'chord-pair';
                    pair.innerHTML = `<span class="chord-label" style="opacity:0; user-select:none;">_</span><span class="lyric-text">${segments[0]}</span>`;
                    lineDiv.appendChild(pair);
                }

                for (let i = 1; i < segments.length; i += 2) {
                    const chordName = segments[i].trim();
                    const lyricText = segments[i + 1] || '';

                    // Normalize user shorthand (e.g., "Am" -> "A minor") for validation
                    let searchName = chordName;
                    const rootMatch = searchName.match(/^[A-G][#b]?/);
                    if (rootMatch) {
                        let root = rootMatch[0];
                        let variant = searchName.slice(root.length).trim();
                        if (variant.toLowerCase() === 'm') variant = 'minor';
                        searchName = `${root} ${variant}`.trim();
                    }

                    const pair = document.createElement('span');
                    pair.className = 'chord-pair';

                    // Check against the normalized 'searchName' instead of raw 'chordName'
                    const isVerified = activeRoots.has(searchName);
                    const statusClass = isVerified ? 'verified' : 'missing';
                    const titleAttr = isVerified ? '' : `title="Click to auto-generate block for ${chordName}"`;

                    pair.innerHTML = `
                        <span class="chord-label ${statusClass}" ${titleAttr} ${!isVerified ? `onclick="quickAddMissingChord('${chordName}')"` : ''}>${chordName}</span>
                        <span class="lyric-text">${lyricText}</span>
                    `;
                    lineDiv.appendChild(pair);
                }
                container.appendChild(lineDiv);
            });
        }

        // The Quick-Add Engine
        window.quickAddMissingChord = function (chordStr) {
            // Attempt to parse what the user typed (e.g. "F# m7" -> root: "F#", variant: "m7")
            const rootMatch = chordStr.match(/^[A-G][#b]?/);
            if (!rootMatch) return alert("Could not understand root note. Please use standard letters (A-G).");

            const root = rootMatch[0];
            let variant = chordStr.slice(root.length).trim();
            if (variant === '' || variant.toLowerCase() === 'm') variant = variant.toLowerCase() === 'm' ? 'minor' : 'major';

            // Verify it exists in our database
            if (!chordDB[root] || !chordDB[root][variant]) {
                return alert(`Sorry, "${root} ${variant}" is not in the database yet!`);
            }

            // Get the target chord data
            const targetPos = chordDB[root][variant][0];
            const parsedShape = parseChordString(targetPos.frets);

            const newChordData = {
                root: root,
                displayRoot: root,
                variant: variant,
                positionIndex: 0,
                fingers: parsedShape.fingers,
                baseFret: targetPos.baseFret || 1,
                capo: 0,
                beats: 4
            };

            // Fetch existing blocks
            const savedBlocks = JSON.parse(localStorage.getItem('chordBlocks') || '[]');

            // Look for existing Auto-Added Chords block
            let autoBlock = savedBlocks.find(b => b.name === "Auto-Added Chords");

            if (!autoBlock) {
                // Create it if it doesn't exist
                autoBlock = {
                    id: Date.now(),
                    name: "Auto-Added Chords",
                    chords: []
                };
                savedBlocks.push(autoBlock);
            }

            // Add the chord to the block (check to prevent duplicates in the list)
            const chordKey = `${root} ${variant}`;
            const alreadyInBlock = autoBlock.chords.some(c => `${c.root} ${c.variant}` === chordKey);

            if (!alreadyInBlock) {
                autoBlock.chords.push(newChordData);
                localStorage.setItem('chordBlocks', JSON.stringify(savedBlocks));
            }

            // Inject block into current song ONLY if it isn't already in the timeline
            if (!currentSongDraft.includes(autoBlock.id)) {
                currentSongDraft.push(autoBlock.id);
            }

            // Re-render UI
            renderSongDraftList();
            renderStudioLyrics(currentSongLyrics);
        };

        // The Plain-Text Translator (Exporter)
        document.getElementById('export-lyrics-txt-btn').addEventListener('click', () => {
            let rawText = document.getElementById('lyric-textarea').value;
            if (!rawText.trim()) return alert("No lyrics to export!");

            let outText = '';
            const lines = rawText.split('\n');

            lines.forEach(line => {
                if (line.trim() === '') { outText += '\n'; return; }

                let chordLine = '';
                let lyricLine = '';
                let segments = line.split(/\[(.*?)\]/g);

                if (segments[0]) {
                    lyricLine += segments[0];
                    chordLine += ' '.repeat(segments[0].length);
                }

                for (let i = 1; i < segments.length; i += 2) {
                    const chord = segments[i];
                    const text = segments[i + 1] || '';

                    chordLine += chord;
                    lyricLine += text;

                    const diff = text.length - chord.length;
                    if (diff > 0) {
                        chordLine += ' '.repeat(diff);
                    } else if (diff < 0) {
                        // Text is shorter than chord, pad the lyric line to keep things aligned
                        lyricLine += ' '.repeat(Math.abs(diff) + 1);
                        chordLine += ' ';
                    }
                }
                outText += chordLine.trimEnd() + '\n' + lyricLine.trimEnd() + '\n';
            });

            // Create downloadable file
            const blob = new Blob([outText], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${document.getElementById('song-name-input').value || 'Song_Lyrics'}.txt`;
            document.body.appendChild(a);
            a.click();

            URL.revokeObjectURL(url);

        // --- DATA RESTORE LOGIC ---

        document.getElementById('import-backup-btn').addEventListener('click', () => {

        // 2. Handle the file upload safely
        document.getElementById('import-backup-file').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                try {
                    const importedData = JSON.parse(event.target.result);

                    if (!importedData.chordBlocks && !importedData.chordSongs) {
                        throw new Error("This doesn't look like a valid Chord Helper backup file.");
                    }

                    // Check if the user already has data to protect
                    const currentBlocksStr = localStorage.getItem('chordBlocks');
                    const hasExistingData = currentBlocksStr && currentBlocksStr !== '[]';
                    let mode = "overwrite";

                    if (hasExistingData) {
                        // Ask the user how they want to handle the collision
                        const wantsMerge = confirm("Backup loaded!\n\nDo you want to MERGE this with your existing library?\n\n• Click 'OK' to safely MERGE.\n• Click 'Cancel' to OVERWRITE (will delete current unsaved work).");

                        if (!wantsMerge) {
                            const confirmOverwrite = confirm("⚠️ ARE YOU SURE? This will completely erase your current library and replace it with the backup.");
                            if (!confirmOverwrite) {
                                e.target.value = ''; // Abort and reset input
                                return;
                            }
                        } else {
                            mode = "merge";
                        }
                    }

                    if (mode === "overwrite") {
                        localStorage.setItem('chordBlocks', JSON.stringify(importedData.chordBlocks || []));
                        localStorage.setItem('chordSongs', JSON.stringify(importedData.chordSongs || []));
                    } else {
                        // Merge Logic: Combine arrays but prevent exact duplicate IDs
                        const currentBlocks = JSON.parse(localStorage.getItem('chordBlocks') || '[]');
                        const currentSongs = JSON.parse(localStorage.getItem('chordSongs') || '[]');

                        const mergedBlocks = [...currentBlocks];
                        (importedData.chordBlocks || []).forEach(ib => {
                            if (!mergedBlocks.find(cb => cb.id === ib.id)) mergedBlocks.push(ib);
                        });

                        const mergedSongs = [...currentSongs];
                        (importedData.chordSongs || []).forEach(is => {
                            if (!mergedSongs.find(cs => cs.id === is.id)) mergedSongs.push(is);
                        });

                        localStorage.setItem('chordBlocks', JSON.stringify(mergedBlocks));
                        localStorage.setItem('chordSongs', JSON.stringify(mergedSongs));
                    }

                    alert(`Backup successfully ${mode === 'merge' ? 'merged' : 'restored'}!`);

                    // Reset input and refresh UI (assuming you have a renderLibrary function)
                    e.target.value = '';
                    if (typeof renderLibrary === 'function') renderLibrary();

                } catch (error) {
                    alert("Error loading backup: " + error.message);
                }
            };
            reader.readAsText(file);
        });

        // --- PERFORMANCE LOGIC ---
        let currentPerformanceId = null;
        let currentPerformanceType = 'block';

        // Autoplay & Focus State
        let focusNodes = [];
        let currentFocusIndex = -1;

        function updateFocusVisuals() {
            focusNodes.forEach((node, idx) => {
                if (idx === currentFocusIndex) {
                    node.style.borderColor = 'var(--accent)';
                    node.style.backgroundColor = 'var(--surface)';
                    node.style.transform = 'scale(1.05)';
                    node.style.boxShadow = '0 4px 15px rgba(0,0,0,0.15)';

                    // Smoothly auto-scroll so the active chord is always centered on screen
                    node.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    node.style.borderColor = 'transparent';
                    node.style.backgroundColor = 'transparent';
                    node.style.transform = 'scale(1)';
                    node.style.boxShadow = 'none';
                }
            });
        }

        function advanceFocus() {
            if (focusNodes.length === 0) return;
            currentFocusIndex++;
            if (currentFocusIndex >= focusNodes.length) {
                currentFocusIndex = 0; // Loop back to the start
            }
            updateFocusVisuals();
        }

        // The global tap-to-advance listener
        document.getElementById('performance-view').addEventListener('click', (e) => {
            // Ignore clicks if they happen on the control bar or header buttons
            if (e.target.closest('#autoplay-controls') || e.target.closest('.header-row')) {
                return;
            }
            // Scrolls down by X % of the screen height
            window.scrollBy({
                top: window.innerHeight * 0.85,
                behavior: 'smooth'
            });
            // advanceFocus(); // If tap needs to only advance chords
        });

        document.getElementById('reset-focus-btn').addEventListener('click', () => {
            currentFocusIndex = -1;
            currentBeat = 0;
            updateFocusVisuals();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        function togglePerformance(show) {
            const perfView = document.getElementById('performance-view');
            const libraryView = document.getElementById('library-view');

            // MASTER RESET
            document.querySelectorAll('.section').forEach(sec => sec.style.display = 'none');

            if (show) {
                perfView.style.display = 'block';
                document.getElementById('draft-nav-bar').style.display = 'none'; // Ensure draft bar stays hidden
            } else {
                libraryView.style.display = 'block'; // Performance always returns to Library
            }
        }

        document.getElementById('close-performance-btn').addEventListener('click', () => {
            if (isAutoplaying) {
                document.getElementById('play-pause-btn').click(); // Cleanly shut down the loop
            }
            togglePerformance(false);
        });

        function renderPerformance(id, type = 'block') {
            currentPerformanceId = id;
            currentPerformanceType = type;

            const grid = document.getElementById('performance-grid');
            grid.innerHTML = '';

            let titleText = '';
            let sectionsToRender = [];

            if (type === 'block') {
                const savedBlocks = JSON.parse(localStorage.getItem('chordBlocks') || '[]');
                const block = savedBlocks.find(b => b.id === id);
                if (!block) return;
                titleText = block.name;
                sectionsToRender.push({ title: null, chords: block.chords });
            } else if (type === 'song') {
                const savedSongs = JSON.parse(localStorage.getItem('chordSongs') || '[]');
                const savedBlocks = JSON.parse(localStorage.getItem('chordBlocks') || '[]');
                const song = savedSongs.find(s => s.id === id);
                if (!song) return;
                titleText = song.name;

                song.blocks.forEach(blockId => {
                    const block = savedBlocks.find(b => b.id === blockId);
                    if (block) {
                        sectionsToRender.push({ title: block.name, chords: block.chords });
                    }
                });
            }

            document.getElementById('performance-title').innerText = titleText;
            const currentThemeColor = getComputedStyle(document.body).getPropertyValue('--primary').trim();

            focusNodes = [];
            flatPerformanceChords = []; // Tracks actual data for Auto-Strum and Beat length
            currentFocusIndex = -1;

            sectionsToRender.forEach(section => {
                if (section.title) {
                    const header = document.createElement('div');
                    header.style.cssText = 'grid-column: 1 / -1; font-weight: bold; font-size: 18px; color: var(--accent); padding-top: 15px; padding-bottom: 5px; border-bottom: 1px solid var(--border); text-align: left; margin-bottom: 10px; width: 100%;';
                    header.innerText = section.title;
                    grid.appendChild(header);
                }

                section.chords.forEach((chord) => {
                    const itemWrapper = document.createElement('div');
                    itemWrapper.style.cssText = 'display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 150px; gap: 5px; padding: 10px; border: 2px solid transparent; border-radius: 8px; transition: all 0.2s ease-in-out; cursor: pointer;';

                    focusNodes.push(itemWrapper);
                    flatPerformanceChords.push(chord); // Save for playback referencing

                    const titleLabel = document.createElement('div');
                    titleLabel.style.cssText = 'font-weight: bold; font-size: 16px; text-align: center;';
                    const displayVariant = chord.variant === 'major' ? '' : chord.variant;

                    if (chord.capo > 0) {
                        titleLabel.innerHTML = `${chord.root} ${displayVariant}<br><span style="font-size: 13px; font-weight: normal; color: var(--accent);">Capo ${chord.capo} (Play ${chord.displayRoot})</span>`;
                    } else {
                        titleLabel.innerText = `${chord.root} ${displayVariant}`.trim();
                    }

                    const chartDiv = document.createElement('div');
                    chartDiv.style.cssText = 'width: 100%; height: 160px;';

                    itemWrapper.appendChild(titleLabel);
                    itemWrapper.appendChild(chartDiv);
                    grid.appendChild(itemWrapper);

                    if (chord.isRest) {
                        titleLabel.innerText = `Rest (${chord.beats} Beats)`;
                        chartDiv.innerHTML = '<div style="display: flex; align-items: center; justify-content: center; height: 100%; font-size: 50px; color: var(--border); opacity: 0.5;">⏸</div>';
                    } else {
                        const miniChart = new window.svguitar.SVGuitarChord(chartDiv);
                        miniChart.chord({ fingers: chord.fingers, barres: [], position: chord.baseFret })
                            .configure({ color: currentThemeColor, nutColor: currentThemeColor, stringColor: currentThemeColor, fretColor: currentThemeColor })
                            .draw();
                    }
                });
            });
        }

        // --- AUTOPLAY & METRONOME ENGINE ---
        let isAutoplaying = false;
        let isMetronomeAudioOn = false;
        let isAutoStrumOn = false;
        let autoplayInterval = null;
        let measureBeat = 0; // Tracks position in the musical measure for the click pitch
        let chordBeatCounter = 0; // Tracks how long we've been on the current chord

        document.getElementById('reset-focus-btn').addEventListener('click', () => {
            currentFocusIndex = -1;
            measureBeat = 0;
            chordBeatCounter = 0;
            updateFocusVisuals();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        function playClick(isDownbeat) {
            if (!isMetronomeAudioOn) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(isDownbeat ? 1200 : 800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function triggerAutoStrum() {
            if (!isAutoStrumOn || currentFocusIndex < 0 || !flatPerformanceChords[currentFocusIndex]) return;
            const chord = flatPerformanceChords[currentFocusIndex];
            if (chord.isRest) return;
            playStrum(chord.fingers, chord.baseFret, chord.capo || 0);
        }

        function metronomeTick() {
            const timeSig = parseInt(document.getElementById('time-sig-select').value);

            // Determine how many beats the current chord is supposed to last
            let targetDuration = timeSig; // Default backwards compatibility
            if (currentFocusIndex >= 0 && flatPerformanceChords[currentFocusIndex]) {
                const savedBeats = flatPerformanceChords[currentFocusIndex].beats;
                if (savedBeats) targetDuration = savedBeats;
            }

            // Advance the chord if we've reached its duration limit (or if we just hit Play)
            if (chordBeatCounter === 0) {
                advanceFocus();
                triggerAutoStrum();
            }

            // Play the metronome click (high pitch exclusively on measure beat 1)
            playClick(measureBeat === 0);

            // Increment timers
            chordBeatCounter++;
            if (chordBeatCounter >= targetDuration) {
                chordBeatCounter = 0; // Reset to trigger the next chord switch
            }

            measureBeat++;
            if (measureBeat >= timeSig) {
                measureBeat = 0; // Reset measure for the click pitch
            }
        }

        document.getElementById('play-pause-btn').addEventListener('click', (e) => {
            const btn = e.target;
            if (isAutoplaying) {
                clearInterval(autoplayInterval);
                isAutoplaying = false;
                btn.innerText = 'Play';
                btn.style.background = 'var(--accent)';
            } else {
                const bpm = parseInt(document.getElementById('tempo-input').value) || 120;
                const intervalMs = 60000 / bpm;

                measureBeat = 0;
                chordBeatCounter = 0;

                // If paused halfway, step back 1 so we resume gracefully on the focused chord
                if (currentFocusIndex >= 0) {
                    currentFocusIndex--;
                }

                metronomeTick(); // Fire immediately

                autoplayInterval = setInterval(metronomeTick, intervalMs);
                isAutoplaying = true;
                btn.innerText = 'Pause';
                btn.style.background = '#e74c3c';
            }
        });

        document.getElementById('tempo-input').addEventListener('change', (e) => {
            if (isAutoplaying) {
                clearInterval(autoplayInterval);
                const bpm = parseInt(e.target.value) || 120;
                autoplayInterval = setInterval(metronomeTick, 60000 / bpm);
            }
        });

        document.getElementById('toggle-audio-btn').addEventListener('click', (e) => {
            isMetronomeAudioOn = !isMetronomeAudioOn;
            const btn = e.target;
            if (isMetronomeAudioOn) {
                initAudio();
                btn.innerText = 'Metronome: ON';
                btn.style.background = 'var(--accent)';
                btn.style.color = 'white';
                btn.style.border = 'none';
            } else {
                btn.innerText = 'Metronome: OFF';
                btn.style.background = 'transparent';
                btn.style.color = 'var(--primary)';
                btn.style.border = '1px solid var(--border)';
            }
        });

        document.getElementById('toggle-strum-audio-btn').addEventListener('click', (e) => {
            isAutoStrumOn = !isAutoStrumOn;
            const btn = e.target;
            if (isAutoStrumOn) {
                initAudio();
                btn.innerText = 'Strum: ON';
                btn.style.background = 'var(--accent)';
                btn.style.color = 'white';
                btn.style.border = 'none';
            } else {
                btn.innerText = 'Strum: OFF';
                btn.style.background = 'transparent';
                btn.style.color = 'var(--primary)';
                btn.style.border = '1px solid var(--border)';
            }
        });

        // --- HELPER FUNCTIONS ---
        function updateDraftBar() {
            const draftBar = document.getElementById('draft-nav-bar');

            if (currentBlockDraft.length > 0) {
                draftBar.style.display = 'flex';
                draftBar.style.bottom = '0';
            } else {
                draftBar.style.display = 'none';
            }
        }

        // --- INITIALIZATION ---
        window.onload = loadChordDatabase;
    </script>
</body>
