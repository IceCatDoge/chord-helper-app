<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chord Helper</title>
    <script src="https://cdn.jsdelivr.net/npm/svguitar@2.5.1/dist/svguitar.umd.js"></script>
    <style>
        /* BASE & THEMES */
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f8f9fa;
            --surface: #ffffff;
            --border: #dddddd;
        }

        body.theme-dark {
            --primary: #ecf0f1;
            --accent: #ffcc00;
            --bg: #1a1a1a;
            --surface: #2d2d2d;
            --border: #444444;
        }

        body.theme-neon {
            --primary: #ffffff;
            --accent: #00ffcc;
            --bg: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --surface: rgba(0,0,0,0.4);
            --border: #00ffcc;
        }

        body.theme-high-contrast {
            --primary: #000000;
            --accent: #0000ff;
            --bg: #ffffff;
            --surface: #ffffff;
            --border: #000000;
        }

        /* STRUCTURAL STYLES */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--primary);
            min-height: 100vh;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            transition: background 0.3s, color 0.3s;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border: 1px solid var(--border);
            transition: background 0.3s;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        button, select, #variant-input {
            background-color: var(--surface);
            border: 2px solid var(--accent);
            color: var(--primary);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            transition: background-color 0.2s, color 0.2s;
        }

        #variant-input {
            width: 140px;
        }

        button:hover, button.active {
            background-color: var(--accent);
            color: var(--surface);
        }

        .tuner-btn {
            font-size: 14px;
            padding: 6px 10px;
            border-color: var(--border);
            color: var(--primary);
        }

        #chord-diagram {
            width: 100%;
            max-width: 320px;
            height: 350px;
            margin: 0 auto;
        }

        .pos-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: -10px;
            margin-bottom: 15px;
        }

            .pos-controls button {
                padding: 4px 12px;
                font-size: 18px;
            }
    </style>
</head>
<body>

    <div class="header-row">
        <h1 style="margin: 0;">Chord Helper</h1>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button id="open-library-btn" style="padding: 6px 12px; font-size: 14px;">Library</button>
            <select id="theme-selector">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="neon">Neon</option>
                <option value="high-contrast">High Contrast</option>
            </select>
        </div>
    </div>

    <div class="section">
        <div class="controls-row">
            <!-- ROOT BUTTONS -->
            <div class="btn-group" id="root-buttons">
                <button class="root-btn active">A</button>
                <button class="root-btn">B</button>
                <button class="root-btn">C</button>
                <button class="root-btn">D</button>
                <button class="root-btn">E</button>
                <button class="root-btn">F</button>
                <button class="root-btn">G</button>
            </div>

            <div class="btn-group" id="accidental-buttons">
                <button class="acc-btn active" data-acc="">♮</button>
                <button class="acc-btn" data-acc="#">♯</button>
                <button class="acc-btn" data-acc="b">♭</button>
            </div>

            <!-- VARIANT SEARCH INPUT -->
            <input type="text" id="variant-input" list="variant-list" placeholder="e.g. minor, m7, maj7" value="">
            <datalist id="variant-list">
                <!-- Options will be injected here dynamically -->
            </datalist>
        </div>

        <!-- Explicit HTML title to prevent SVG overlap bugs -->
        <h2 id="main-chord-title" style="margin-top: 0; margin-bottom: 10px; font-size: 22px; height: 26px;"></h2>
        <div id="chord-diagram"></div>

        <!-- POSITION TOGGLE -->
        <div class="pos-controls" id="pos-controls" style="display: none;">
            <button id="prev-pos">&lt;</button>
            <span id="pos-indicator">Pos 1 / 1</span>
            <button id="next-pos">&gt;</button>
        </div>

        <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
            <button id="strum-btn" style="width: 160px; display: none;">Strum</button>
            <button id="add-chord-btn" style="width: 160px; display: none;">➕ Add to Block</button>
        </div>
    </div>

    <!-- MINI TUNER -->
    <div class="section">
        <h3 style="margin-top:0; font-size:16px;">Reference Tuner</h3>
        <div class="btn-group">
            <button class="tuner-btn" onclick="toggleTuner(this, 82.41)">E</button>
            <button class="tuner-btn" onclick="toggleTuner(this, 110.00)">A</button>
            <button class="tuner-btn" onclick="toggleTuner(this, 146.83)">D</button>
            <button class="tuner-btn" onclick="toggleTuner(this, 196.00)">G</button>
            <button class="tuner-btn" onclick="toggleTuner(this, 246.94)">B</button>
            <button class="tuner-btn" onclick="toggleTuner(this, 329.63)">e</button>
        </div>
    </div>

    <!-- EDITOR VIEW (Hidden by default) -->
    <div id="editor-view" class="section" style="display: none; min-height: 400px; text-align: left;">
        <div class="header-row" style="margin-bottom: 20px;">
            <button id="close-editor-btn" style="padding: 6px 12px; font-size: 14px;">⬅ Back</button>
            <h2 style="margin: 0; font-size: 18px;">Save Block</h2>
            <button id="save-block-btn" style="background-color: var(--accent); color: white; padding: 6px 12px; font-size: 14px;">Save</button>
        </div>
        <input type="text" id="block-name-input" placeholder="e.g., Verse 1, Chorus..." style="width: 100%; box-sizing: border-box; margin-bottom: 15px; font-size: 16px; padding: 10px; border-radius: 6px; border: 2px solid var(--border); background: var(--surface); color: var(--primary); outline: none;">
        <div id="draft-list" style="display: flex; flex-direction: column; gap: 8px;">
            <!-- Draft items injected here -->
        </div>

        <button id="clear-draft-btn" style="margin-top: 20px; width: 100%; background: transparent; color: #ffcc00; border-color: #ffcc00;">Clear Draft</button>
    </div>

    <!-- LIBRARY VIEW (Hidden by default) -->
    <div id="library-view" class="section" style="display: none; min-height: 400px; text-align: left;">
        <div class="header-row" style="margin-bottom: 20px;">
            <button id="close-library-btn" style="padding: 6px 12px; font-size: 14px;">⬅ Back</button>
            <div style="display: flex; gap: 10px;">
                <button id="tab-blocks" class="active" style="background: var(--accent); color: white; padding: 6px 12px; font-size: 14px; border: none; border-radius: 4px;">Blocks</button>
                <button id="tab-songs" style="background: var(--surface); color: var(--primary); padding: 6px 12px; font-size: 14px; border: 1px solid var(--border); border-radius: 4px;">Songs</button>
            </div>
            <div style="width: 70px;"></div>
        </div>

        <div id="library-blocks-container">
            <div id="library-list" style="display: flex; flex-direction: column; gap: 12px;">
                <!-- Saved blocks get injected here -->
            </div>
        </div>

        <div id="library-songs-container" style="display: none;">
            <button id="create-song-btn" style="width: 100%; padding: 10px; margin-bottom: 15px; background: var(--accent); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold;">Create New Song</button>
            <div id="library-songs-list" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>
    </div>

    <!-- SONG EDITOR VIEW (Hidden by default) -->
    <div id="song-editor-view" class="section" style="display: none; min-height: 400px; text-align: left;">
        <div class="header-row" style="margin-bottom: 20px;">
            <button id="cancel-song-btn" style="padding: 6px 12px; font-size: 14px;">Cancel</button>
            <h2 style="margin: 0; font-size: 18px;">Song Assembler</h2>
            <button id="save-song-btn" style="background-color: var(--accent); color: white; padding: 6px 12px; font-size: 14px;">Save</button>
        </div>
        <input type="text" id="song-name-input" placeholder="Song Name (e.g. Wonderwall)" style="width: 100%; box-sizing: border-box; margin-bottom: 15px; font-size: 16px; padding: 10px; border-radius: 6px; border: 2px solid var(--border); background: var(--surface); color: var(--primary); outline: none;">

        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <select id="song-block-select" style="flex: 1; padding: 10px; border-radius: 6px; border: 2px solid var(--border); background: var(--surface); color: var(--primary); font-size: 14px;"></select>
            <button id="add-block-to-song-btn" style="padding: 0 15px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold;">Add Block</button>
        </div>

        <div id="song-draft-list" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;"></div>
    </div>

    <!-- PERFORMANCE VIEW (Hidden by default) -->
    <div id="performance-view" class="section" style="display: none; min-height: 400px; text-align: left;">
        <div class="header-row" style="margin-bottom: 20px;">
            <button id="close-performance-btn" style="padding: 6px 12px; font-size: 14px;">⬅ Library</button>
            <h2 id="performance-title" style="margin: 0; font-size: 18px;">Live View</h2>
            <div style="width: 85px;"></div>
        </div>
        <!-- Horizontal Grid Container -->
        <div id="performance-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; justify-items: center;">
            <!-- Chords injected here -->
        </div>
    </div>

    <!-- BOTTOM DRAFT BAR -->
    <div id="draft-nav-bar" style="position: fixed; bottom: -100px; left: 0; right: 0; background: var(--surface); padding: 15px; box-shadow: 0 -4px 15px rgba(0,0,0,0.15); transition: bottom 0.3s ease-in-out; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid var(--accent); z-index: 1000; max-width: 800px; margin: 0 auto; box-sizing: border-box;">
        <span style="font-weight: bold; font-size: 16px;"><span id="draft-count" style="color: var(--accent);">0</span> Chords in Draft</span>
        <button id="view-draft-btn" style="background-color: var(--accent); color: white; border-color: var(--accent);">Edit Block</button>
    </div>

    <script>
        // --- DYNAMIC CHORD DATABASE ---
        let chordDB = {}; // Start with an empty object

        // --- FETCH AND ADAPT DATA ---
        async function loadChordDatabase() {
            const diagramContainer = document.getElementById('chord-diagram');
            diagramContainer.innerHTML = '<p style="color: #888; margin-top: 50%;">Loading chord database...</p>';

            try {
                // Fetch the main guitar.json from the tombatossals repo via jsDelivr
                const response = await fetch('https://cdn.jsdelivr.net/gh/tombatossals/chords-db@master/lib/guitar.json');
                const rawData = await response.json();

                // Loop directly over the keys in the chords object (e.g., "C", "Csharp")
                for (const internalKey in rawData.chords) {
                    const variations = rawData.chords[internalKey];

                    // Safety check to skip empty entries
                    if (!variations || variations.length === 0) continue;

                    // The database stores the true, readable root note (e.g., "C#") inside the chord data itself
                    const rootKey = variations[0].key;

                    if (!chordDB[rootKey]) {
                        chordDB[rootKey] = {}; // Initialize the root note
                    }

                    variations.forEach(chordObj => {
                        const variantName = chordObj.suffix;

                        const positions = chordObj.positions.map(pos => {
                            const fretsArray = Array.isArray(pos.frets) ? pos.frets : pos.frets.split('');
                            return {
                                // Save the translated string
                                frets: fretsArray.map(f => (f === -1 || f === 'x' || f === 'X') ? 'x' : f).join(' '),
                                // Grab the starting fret number (fallback to 1)
                                baseFret: pos.baseFret || 1
                            };
                        });

                        chordDB[rootKey][variantName] = positions;
                    });
                }

                // Populate the dropdown menu dynamically
                updateVariantList('A');
                renderChord();

            } catch (error) {
                console.error("Error loading chords:", error);
                diagramContainer.innerHTML = '<p style="color: red; margin-top: 50%;">Failed to load database. Check console.</p>';
            }
        }

        // Helper to update the datalist dynamically based on available chords
        function updateVariantList(rootNote) {
            const datalist = document.getElementById('variant-list');
            datalist.innerHTML = '';

            if (!chordDB[rootNote]) return;

            const variants = Object.keys(chordDB[rootNote]).sort();

            variants.forEach(variant => {
                const option = document.createElement('option');
                option.value = variant;
                datalist.appendChild(option);
            });

            // Ensure the input value is valid, otherwise reset
            const variantInput = document.getElementById('variant-input');
            let intendedVariant = variantInput.value.trim() === '' ? 'major' : variantInput.value.trim();

            if (!chordDB[rootNote][intendedVariant]) {
                intendedVariant = variants.includes('major') ? 'major' : variants[0];
            }
            currentVariant = intendedVariant;
            variantInput.value = currentVariant === 'major' ? '' : currentVariant;
        }

        function updateRootSelection() {
            let target = selectedBaseRoot + selectedAccidental;
            // Map common enharmonics to what the database actually uses
            const enharmonics = { 'A#': 'Bb', 'Bb': 'A#', 'C#': 'Db', 'Db': 'C#', 'D#': 'Eb', 'Eb': 'D#', 'E#': 'F', 'Fb': 'E', 'F#': 'Gb', 'Gb': 'F#', 'G#': 'Ab', 'Ab': 'G#', 'B#': 'C', 'Cb': 'B' };

            if (chordDB[target]) {
                currentRoot = target;
            } else if (enharmonics[target] && chordDB[enharmonics[target]]) {
                currentRoot = enharmonics[target];
            } else {
                currentRoot = target; // Fallback, will show "Not in database"
            }

            currentPosIndex = 0;
            updateVariantList(currentRoot);
            renderChord();
        }

        document.querySelectorAll('.root-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.root-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                selectedBaseRoot = e.target.innerText.trim();
                updateRootSelection();
            });
        });

        document.querySelectorAll('.acc-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.acc-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                selectedAccidental = e.target.getAttribute('data-acc');
                updateRootSelection();
            });
        });

        // --- TRANSLATION LAYER ---
        function parseChordString(fretStr) {
            const frets = fretStr.split(' ');
            const fingers = [];

            frets.forEach((fret, index) => {
                const stringNum = 6 - index; // Map index 0 to guitar string 6 (low E)
                const val = fret.toLowerCase() === 'x' ? 'x' : parseInt(fret, 10);
                fingers.push([stringNum, val]);
            });
            return { fingers };
        }

        // --- STATE & AUDIO ---
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

        let chart;
        let selectedBaseRoot = 'A';
        let selectedAccidental = '';
        let currentRoot = 'A';
        let currentVariant = 'major';
        let currentPosIndex = 0;
        let activeChordData = null;

        function initChart() {
            document.getElementById('chord-diagram').innerHTML = '';
            chart = new window.svguitar.SVGuitarChord('#chord-diagram');
        }

        function renderChord() {
            if (!chart) initChart();

            const rootData = chordDB[currentRoot];
            const positions = rootData ? rootData[currentVariant] : null;

            const strumBtn = document.getElementById('strum-btn');
            const posControls = document.getElementById('pos-controls');
            const posIndicator = document.getElementById('pos-indicator');

            if (positions && positions.length > 0) {
                if (currentPosIndex >= positions.length) currentPosIndex = 0;

                const posData = positions[currentPosIndex];
                activeChordData = parseChordString(posData.frets);
                activeChordData.baseFret = posData.baseFret;

                const currentThemeColor = getComputedStyle(document.body).getPropertyValue('--primary').trim();

                // Update the decoupled HTML title (major is blank for standard notation)
                const displayVariant = currentVariant === 'major' ? '' : currentVariant;
                document.getElementById('main-chord-title').innerText = `${currentRoot} ${displayVariant}`.trim();

                chart.chord({
                    fingers: activeChordData.fingers,
                    barres: [],
                    position: posData.baseFret
                })
                    .configure({
                        color: currentThemeColor,
                        nutColor: currentThemeColor,
                        stringColor: currentThemeColor,
                        fretColor: currentThemeColor
                        // Title intentionally omitted to prevent overlapping
                    })
                    .draw();

                strumBtn.style.display = 'inline-block';
                document.getElementById('add-chord-btn').style.display = 'inline-block';

                if (positions.length > 1) {
                    posControls.style.display = 'flex';
                    posIndicator.innerText = `Pos ${currentPosIndex + 1} / ${positions.length}`;
                } else {
                    posControls.style.display = 'none';
                }
            } else {
                activeChordData = null;
                document.getElementById('main-chord-title').innerText = ''; // Clear the title
                document.getElementById('chord-diagram').innerHTML =
                    `<p style="color: #888; margin-top: 50%;">Not in database yet.</p>`;
                chart = null;
                strumBtn.style.display = 'none';
                posControls.style.display = 'none';
                document.getElementById('add-chord-btn').style.display = 'none';
            }
        }

        // --- EVENT LISTENERS ---
        // Smart listener for the datalist input
        const variantInput = document.getElementById('variant-input');

        variantInput.addEventListener('input', (e) => {
            let val = e.target.value.trim();
            if (val === '') val = 'major'; // Empty field equals major

            // Only re-render if they typed/selected a valid chord variant
            if (chordDB[currentRoot] && chordDB[currentRoot][val]) {
                currentVariant = val;
                currentPosIndex = 0;
                renderChord();
            }
        });

        variantInput.addEventListener('change', (e) => {
            let val = e.target.value.trim();
            if (val === '') val = 'major';

            // Revert If user clicked out of the box after typo
            if (!chordDB[currentRoot] || !chordDB[currentRoot][val]) {
                e.target.value = currentVariant === 'major' ? '' : currentVariant;
            }
        });

        // --- SEQUENCE DRAFTING STATE ---
        let currentBlockDraft = [];
        let currentEditingBlockId = null;

        document.getElementById('add-chord-btn').addEventListener('click', () => {
            if (!activeChordData) return;

            // Save current chord's state
            currentBlockDraft.push({
                root: currentRoot,
                variant: currentVariant,
                positionIndex: currentPosIndex,
                fingers: activeChordData.fingers,
                baseFret: chordDB[currentRoot][currentVariant][currentPosIndex].baseFret
            });

            // Visual feedback to user
            const btn = document.getElementById('add-chord-btn');
            const originalText = btn.innerText;
            btn.innerText = `Added! (${currentBlockDraft.length})`;
            setTimeout(() => { btn.innerText = originalText; }, 1000);

            // Update the counter, slide the bar up, and pad the body so it doesn't hide the tuner
            document.getElementById('draft-count').innerText = currentBlockDraft.length;
            document.getElementById('draft-nav-bar').style.bottom = '0';
            document.body.style.paddingBottom = '80px';
        });

        document.getElementById('next-pos').addEventListener('click', () => {
            const positions = chordDB[currentRoot][currentVariant];
            if (currentPosIndex < positions.length - 1) {
                currentPosIndex++;
                renderChord();
            }
        });

        document.getElementById('prev-pos').addEventListener('click', () => {
            if (currentPosIndex > 0) {
                currentPosIndex--;
                renderChord();
            }
        });

        // --- AUDIO PLAYBACK ---
        const openStrings = { 6: 82.41, 5: 110.00, 4: 146.83, 3: 196.00, 2: 246.94, 1: 329.63 };

        let activeTunerOsc = null;
        let activeTunerBtn = null;

        function toggleTuner(btn, freq) {
            initAudio();

            // If clicking the same button, turn it off
            if (activeTunerBtn === btn) {
                if (activeTunerOsc) activeTunerOsc.stop();
                btn.classList.remove('active');
                activeTunerBtn = null;
                activeTunerOsc = null;
                return;
            }

            // Stop any currently playing string
            if (activeTunerOsc) {
                activeTunerOsc.stop();
                activeTunerBtn.classList.remove('active');
            }

            // Start the new string (sustained)
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            // Set a comfortable, continuous volume
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();

            activeTunerOsc = osc;
            activeTunerBtn = btn;
            btn.classList.add('active');
        }

        document.getElementById('strum-btn').addEventListener('click', () => {
            if (!activeChordData) return;
            initAudio();
            const now = audioCtx.currentTime;
            let delay = 0;
            const sortedFingers = [...activeChordData.fingers].sort((a, b) => b[0] - a[0]);
            const baseFret = activeChordData.baseFret || 1;

            sortedFingers.forEach(([string, fret]) => {
                if (fret !== 'x') {
                    // Open strings (0) stay 0. Fretted notes shift up based on the position.
                    const absoluteFret = fret === 0 ? 0 : (baseFret + fret - 1);
                    const freq = openStrings[string] * Math.pow(2, absoluteFret / 12);
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now + delay);
                    gain.gain.setValueAtTime(0, now + delay);
                    gain.gain.linearRampToValueAtTime(0.4, now + delay + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 2.5);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + delay); osc.stop(now + delay + 2.5);
                    delay += 0.04;
                }
            });
        });

        // --- THEMES ---
        document.getElementById('theme-selector').addEventListener('change', (e) => {
            document.body.className = ''; // Clear old themes
            if (e.target.value !== 'light') {
                document.body.classList.add(`theme-${e.target.value}`);
            }
            // Re-rendering based on which view is currently active
            renderChord();

            if (document.getElementById('performance-view') && document.getElementById('performance-view').style.display === 'block') {
                renderPerformance(currentPerformanceId, currentPerformanceType);
            }
        });

        // --- EDITOR LOGIC ---
        const mainSections = () => document.querySelectorAll('.section:not(#editor-view):not(#library-view):not(#performance-view):not(#song-editor-view)');

        function toggleEditor(show) {
            const editorView = document.getElementById('editor-view');
            const draftBar = document.getElementById('draft-nav-bar');

            if (show) {
                mainSections().forEach(sec => sec.style.display = 'none');
                editorView.style.display = 'block';
                draftBar.style.display = 'none'; // Hide floating bar while editing
                renderDraftList();
            } else {
                mainSections().forEach(sec => sec.style.display = 'block');
                editorView.style.display = 'none';
                if (currentBlockDraft.length > 0) draftBar.style.display = 'flex';
            }
        }

        function renderDraftList() {
            const list = document.getElementById('draft-list');
            list.innerHTML = '';

            currentBlockDraft.forEach((chord, index) => {
                const item = document.createElement('div');
                // Added bottom margin so stacked items don't touch
                item.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; font-size: 16px; margin-bottom: 8px;';

                const displayVariant = chord.variant === 'major' ? '' : chord.variant;

                // Text container
                const textDiv = document.createElement('div');
                textDiv.innerHTML = `<strong>${chord.root} ${displayVariant}</strong> <span style="font-size: 14px; opacity: 0.8; margin-left: 8px;">Pos ${chord.positionIndex + 1}</span>`;

                // Controls container
                const controlsDiv = document.createElement('div');
                controlsDiv.style.cssText = 'display: flex; gap: 6px;';

                // Move Up Button (hidden for the first item)
                if (index > 0) {
                    const upBtn = document.createElement('button');
                    upBtn.innerText = '↑';
                    upBtn.style.cssText = 'padding: 4px 10px; font-size: 16px; background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 4px;';
                    upBtn.onclick = () => {
                        [currentBlockDraft[index - 1], currentBlockDraft[index]] = [currentBlockDraft[index], currentBlockDraft[index - 1]];
                        renderDraftList();
                    };
                    controlsDiv.appendChild(upBtn);
                }

                // Move Down Button (hidden for the last item)
                if (index < currentBlockDraft.length - 1) {
                    const downBtn = document.createElement('button');
                    downBtn.innerText = '↓';
                    downBtn.style.cssText = 'padding: 4px 10px; font-size: 16px; background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 4px;';
                    downBtn.onclick = () => {
                        [currentBlockDraft[index], currentBlockDraft[index + 1]] = [currentBlockDraft[index + 1], currentBlockDraft[index]];
                        renderDraftList();
                    };
                    controlsDiv.appendChild(downBtn);
                }

                // Delete Button
                const delBtn = document.createElement('button');
                delBtn.innerText = '✕';
                delBtn.style.cssText = 'padding: 4px 10px; font-size: 14px; background: transparent; color: #ff5555; border: 1px solid var(--border); border-radius: 4px;';
                delBtn.onclick = () => {
                    currentBlockDraft.splice(index, 1);
                    document.getElementById('draft-count').innerText = currentBlockDraft.length;

                    // If last chord is eleted, close
                    if (currentBlockDraft.length === 0) {
                        currentEditingBlockId = null;
                        document.getElementById('draft-nav-bar').style.bottom = '-100px';
                        toggleEditor(false);
                    }
                    renderDraftList();
                };
                controlsDiv.appendChild(delBtn);

                item.appendChild(textDiv);
                item.appendChild(controlsDiv);
                list.appendChild(item);
            });
        }

        document.getElementById('view-draft-btn').addEventListener('click', () => toggleEditor(true));
        document.getElementById('close-editor-btn').addEventListener('click', () => toggleEditor(false));

        document.getElementById('clear-draft-btn').addEventListener('click', () => {
            currentBlockDraft = [];
            currentEditingBlockId = null;
            document.getElementById('draft-count').innerText = '0';
            document.getElementById('draft-nav-bar').style.bottom = '-100px';
            document.body.style.paddingBottom = '0';
            toggleEditor(false);
        });

        document.getElementById('save-block-btn').addEventListener('click', () => {
            if (currentBlockDraft.length === 0) return alert("Nothing to save!");

            const nameInput = document.getElementById('block-name-input');
            const name = nameInput.value.trim() || 'Untitled Block';

            // Fetch existing blocks from local storage or start fresh
            const savedBlocks = JSON.parse(localStorage.getItem('chordBlocks') || '[]');

            if (currentEditingBlockId) {
                // Update existing block
                const blockIndex = savedBlocks.findIndex(b => b.id === currentEditingBlockId);
                if (blockIndex > -1) {
                    savedBlocks[blockIndex].name = name;
                    savedBlocks[blockIndex].chords = currentBlockDraft;
                } else {
                    savedBlocks.push({ id: Date.now(), name: name, chords: currentBlockDraft });
                }
            } else {
                // New block with unique ID
                savedBlocks.push({ id: Date.now(), name: name, chords: currentBlockDraft });
            }

            localStorage.setItem('chordBlocks', JSON.stringify(savedBlocks));
            alert(`"${name}" saved successfully to your device!`);

            // Reset the app state and return to main view
            document.getElementById('clear-draft-btn').click();
            nameInput.value = '';
        });

        // --- LIBRARY LOGIC ---
        function toggleLibrary(show) {
            const libraryView = document.getElementById('library-view');
            const draftBar = document.getElementById('draft-nav-bar');

            if (show) {
                mainSections().forEach(sec => sec.style.display = 'none');
                document.getElementById('editor-view').style.display = 'none';
                if (document.getElementById('song-editor-view')) {
                    document.getElementById('song-editor-view').style.display = 'none';
                }
                if (document.getElementById('performance-view')) {
                    document.getElementById('performance-view').style.display = 'none'; // Ensure performance view stays shut
                }
                libraryView.style.display = 'block';
                draftBar.style.display = 'none';
                renderLibrary();
            } else {
                mainSections().forEach(sec => sec.style.display = 'block');
                libraryView.style.display = 'none';
                if (currentBlockDraft.length > 0) draftBar.style.display = 'flex';
            }
        }

        function renderLibrary() {
            const list = document.getElementById('library-list');
            list.innerHTML = '';
            const savedBlocks = JSON.parse(localStorage.getItem('chordBlocks') || '[]');

            if (savedBlocks.length === 0) {
                list.innerHTML = '<p style="color: var(--primary); opacity: 0.7; text-align: center; margin-top: 40px;">No blocks saved yet.</p>';
                return;
            }

            savedBlocks.forEach(block => {
                const item = document.createElement('div');
                item.style.cssText = 'padding: 15px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;';

                const header = document.createElement('div');
                header.style.cssText = 'display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;';
                header.innerHTML = `<strong>${block.name}</strong> <span style="font-size: 14px; opacity: 0.8;">${block.chords.length} chords</span>`;

                const actions = document.createElement('div');
                actions.style.cssText = 'display: flex; gap: 8px; justify-content: space-between;';

                const viewBtn = document.createElement('button');
                viewBtn.innerText = 'View & Play';
                viewBtn.style.cssText = 'flex: 1; padding: 8px; font-size: 14px;';

                viewBtn.onclick = () => {
                    renderPerformance(block.id);
                    togglePerformance(true);
                };

                const editBtn = document.createElement('button');
                editBtn.innerText = 'Edit';
                editBtn.style.cssText = 'flex: 1; padding: 8px; font-size: 14px;';
                editBtn.onclick = () => {
                    if (currentBlockDraft.length > 0) {
                        if (!confirm("Warning: This will overwrite your current unsaved draft. Continue?")) return;
                    }

                    // Deep copy the saved chords into the draft so we don't accidentally edit local storage directly
                    currentBlockDraft = JSON.parse(JSON.stringify(block.chords));
                    currentEditingBlockId = block.id;

                    document.getElementById('draft-count').innerText = currentBlockDraft.length;
                    document.getElementById('block-name-input').value = block.name;

                    toggleLibrary(false);
                    toggleEditor(true);
                };

                const delBtn = document.createElement('button');
                delBtn.innerText = 'Delete';
                delBtn.style.cssText = 'flex: 1; padding: 8px; font-size: 14px; background: transparent; color: #ffcc00; border-color: #ffcc00;';
                delBtn.onclick = () => {
                    if (confirm(`Are you sure you want to delete "${block.name}"?`)) {
                        const updated = savedBlocks.filter(b => b.id !== block.id);
                        localStorage.setItem('chordBlocks', JSON.stringify(updated));
                        renderLibrary();
                    }
                };

                actions.appendChild(viewBtn);
                actions.appendChild(editBtn);
                actions.appendChild(delBtn);
                item.appendChild(header);
                item.appendChild(actions);
                list.appendChild(item);
            });
        }

        document.getElementById('open-library-btn').addEventListener('click', () => toggleLibrary(true));
        document.getElementById('close-library-btn').addEventListener('click', () => toggleLibrary(false));

        // --- SONGS LOGIC ---
        let currentSongDraft = [];
        let currentEditingSongId = null;

        document.getElementById('tab-blocks').addEventListener('click', (e) => {
            e.target.style.background = 'var(--accent)';
            e.target.style.color = 'white';
            e.target.style.border = 'none';

            const tabSongs = document.getElementById('tab-songs');
            tabSongs.style.background = 'var(--surface)';
            tabSongs.style.color = 'var(--primary)';
            tabSongs.style.border = '1px solid var(--border)';

            document.getElementById('library-blocks-container').style.display = 'block';
            document.getElementById('library-songs-container').style.display = 'none';
        });

        document.getElementById('tab-songs').addEventListener('click', (e) => {
            e.target.style.background = 'var(--accent)';
            e.target.style.color = 'white';
            e.target.style.border = 'none';

            const tabBlocks = document.getElementById('tab-blocks');
            tabBlocks.style.background = 'var(--surface)';
            tabBlocks.style.color = 'var(--primary)';
            tabBlocks.style.border = '1px solid var(--border)';

            document.getElementById('library-blocks-container').style.display = 'none';
            document.getElementById('library-songs-container').style.display = 'block';
            renderSongsList();
        });

        function toggleSongEditor(show) {
            const editor = document.getElementById('song-editor-view');
            if (show) {
                mainSections().forEach(sec => sec.style.display = 'none');
                editor.style.display = 'block';

                const select = document.getElementById('song-block-select');
                select.innerHTML = '';
                const savedBlocks = JSON.parse(localStorage.getItem('chordBlocks') || '[]');
                if (savedBlocks.length === 0) {
                    select.innerHTML = '<option value="">No blocks saved</option>';
                } else {
                    savedBlocks.forEach(b => {
                        const opt = document.createElement('option');
                        opt.value = b.id;
                        opt.innerText = b.name;
                        select.appendChild(opt);
                    });
                }
            } else {
                editor.style.display = 'none';
                mainSections().forEach(sec => sec.style.display = 'block');
            }
        }

        document.getElementById('create-song-btn').addEventListener('click', () => {
            currentSongDraft = [];
            currentEditingSongId = null;
            document.getElementById('song-name-input').value = '';
            renderSongDraftList();
            toggleLibrary(false);
            toggleSongEditor(true);
        });

        document.getElementById('cancel-song-btn').addEventListener('click', () => {
            toggleSongEditor(false);
            toggleLibrary(true);
            document.getElementById('tab-songs').click();
        });

        document.getElementById('add-block-to-song-btn').addEventListener('click', () => {
            const select = document.getElementById('song-block-select');
            if (select.value) {
                currentSongDraft.push(parseInt(select.value));
                renderSongDraftList();
            }
        });

        function renderSongDraftList() {
            const list = document.getElementById('song-draft-list');
            list.innerHTML = '';
            const savedBlocks = JSON.parse(localStorage.getItem('chordBlocks') || '[]');

            currentSongDraft.forEach((blockId, index) => {
                const block = savedBlocks.find(b => b.id === blockId);
                const blockName = block ? block.name : 'Deleted Block';

                const item = document.createElement('div');
                item.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; font-size: 16px;';

                const textDiv = document.createElement('div');
                textDiv.innerHTML = `<strong>${index + 1}. ${blockName}</strong>`;

                const controlsDiv = document.createElement('div');
                controlsDiv.style.cssText = 'display: flex; gap: 6px;';

                if (index > 0) {
                    const upBtn = document.createElement('button');
                    upBtn.innerText = 'Up';
                    upBtn.style.cssText = 'padding: 4px 10px; font-size: 14px; background: transparent; color: var(--primary); border: 1px solid var(--border); border-radius: 4px;';
                    upBtn.onclick = () => {
                        [currentSongDraft[index - 1], currentSongDraft[index]] = [currentSongDraft[index], currentSongDraft[index - 1]];
                        renderSongDraftList();
                    };
                    controlsDiv.appendChild(upBtn);
                }

                if (index < currentSongDraft.length - 1) {
                    const downBtn = document.createElement('button');
                    downBtn.innerText = 'Down';
                    downBtn.style.cssText = 'padding: 4px 10px; font-size: 14px; background: transparent; color: var(--primary); border: 1px solid var(--border); border-radius: 4px;';
                    downBtn.onclick = () => {
                        [currentSongDraft[index], currentSongDraft[index + 1]] = [currentSongDraft[index + 1], currentSongDraft[index]];
                        renderSongDraftList();
                    };
                    controlsDiv.appendChild(downBtn);
                }

                const delBtn = document.createElement('button');
                delBtn.innerText = 'Remove';
                delBtn.style.cssText = 'padding: 4px 10px; font-size: 14px; background: transparent; color: #ff5555; border: 1px solid var(--border); border-radius: 4px;';
                delBtn.onclick = () => {
                    currentSongDraft.splice(index, 1);
                    renderSongDraftList();
                };
                controlsDiv.appendChild(delBtn);

                item.appendChild(textDiv);
                item.appendChild(controlsDiv);
                list.appendChild(item);
            });
        }

        document.getElementById('save-song-btn').addEventListener('click', () => {
            const name = document.getElementById('song-name-input').value.trim();
            if (!name) return alert("Please enter a song name.");
            if (currentSongDraft.length === 0) return alert("Add at least one block to your song.");

            const savedSongs = JSON.parse(localStorage.getItem('chordSongs') || '[]');

            if (currentEditingSongId) {
                const idx = savedSongs.findIndex(s => s.id === currentEditingSongId);
                if (idx > -1) {
                    savedSongs[idx].name = name;
                    savedSongs[idx].blocks = currentSongDraft;
                } else {
                    savedSongs.push({ id: Date.now(), name: name, blocks: currentSongDraft });
                }
            } else {
                savedSongs.push({ id: Date.now(), name: name, blocks: currentSongDraft });
            }

            localStorage.setItem('chordSongs', JSON.stringify(savedSongs));
            toggleSongEditor(false);
            toggleLibrary(true);
            document.getElementById('tab-songs').click();
        });

        function renderSongsList() {
            const list = document.getElementById('library-songs-list');
            list.innerHTML = '';
            const savedSongs = JSON.parse(localStorage.getItem('chordSongs') || '[]');

            if (savedSongs.length === 0) {
                list.innerHTML = '<p style="color: var(--primary); opacity: 0.7; text-align: center; margin-top: 40px;">No songs saved yet.</p>';
                return;
            }

            savedSongs.forEach(song => {
                const item = document.createElement('div');
                item.style.cssText = 'padding: 15px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;';

                const header = document.createElement('div');
                header.style.cssText = 'display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;';
                header.innerHTML = `<strong>${song.name}</strong> <span style="font-size: 14px; opacity: 0.8;">${song.blocks.length} blocks</span>`;

                const actions = document.createElement('div');
                actions.style.cssText = 'display: flex; gap: 8px; justify-content: space-between;';

                const playBtn = document.createElement('button');
                playBtn.innerText = 'Play';
                playBtn.style.cssText = 'flex: 1; padding: 8px; font-size: 14px;';
                playBtn.onclick = () => {
                    renderPerformance(song.id, 'song');
                    togglePerformance(true);
                };

                const editBtn = document.createElement('button');
                editBtn.innerText = 'Edit';
                editBtn.style.cssText = 'flex: 1; padding: 8px; font-size: 14px;';
                editBtn.onclick = () => {
                    currentSongDraft = [...song.blocks];
                    currentEditingSongId = song.id;
                    document.getElementById('song-name-input').value = song.name;
                    renderSongDraftList();
                    toggleLibrary(false);
                    toggleSongEditor(true);
                };

                const delBtn = document.createElement('button');
                delBtn.innerText = 'Delete';
                delBtn.style.cssText = 'flex: 1; padding: 8px; font-size: 14px; background: transparent; color: #ffcc00; border-color: #ffcc00;';
                delBtn.onclick = () => {
                    if (confirm(`Delete song "${song.name}"?`)) {
                        const updated = savedSongs.filter(s => s.id !== song.id);
                        localStorage.setItem('chordSongs', JSON.stringify(updated));
                        renderSongsList();
                    }
                };

                actions.appendChild(playBtn);
                actions.appendChild(editBtn);
                actions.appendChild(delBtn);
                item.appendChild(header);
                item.appendChild(actions);
                list.appendChild(item);
            });
        }

        // --- PERFORMANCE LOGIC ---
        let currentPerformanceId = null;
        let currentPerformanceType = 'block';

        function togglePerformance(show) {
            const perfView = document.getElementById('performance-view');
            const libraryView = document.getElementById('library-view');

            if (show) {
                libraryView.style.display = 'none';
                perfView.style.display = 'block';
            } else {
                perfView.style.display = 'none';
                libraryView.style.display = 'block';
            }
        }

        document.getElementById('close-performance-btn').addEventListener('click', () => togglePerformance(false));

        function renderPerformance(id, type = 'block') {
            currentPerformanceId = id;
            currentPerformanceType = type;

            const grid = document.getElementById('performance-grid');
            grid.innerHTML = '';

            let titleText = '';
            let sectionsToRender = [];

            if (type === 'block') {
                const savedBlocks = JSON.parse(localStorage.getItem('chordBlocks') || '[]');
                const block = savedBlocks.find(b => b.id === id);
                if (!block) return;
                titleText = block.name;
                sectionsToRender.push({ title: null, chords: block.chords });
            } else if (type === 'song') {
                const savedSongs = JSON.parse(localStorage.getItem('chordSongs') || '[]');
                const savedBlocks = JSON.parse(localStorage.getItem('chordBlocks') || '[]');
                const song = savedSongs.find(s => s.id === id);
                if (!song) return;
                titleText = song.name;

                song.blocks.forEach(blockId => {
                    const block = savedBlocks.find(b => b.id === blockId);
                    if (block) {
                        sectionsToRender.push({ title: block.name, chords: block.chords });
                    }
                });
            }

            document.getElementById('performance-title').innerText = titleText;
            const currentThemeColor = getComputedStyle(document.body).getPropertyValue('--primary').trim();

            sectionsToRender.forEach(section => {
                if (section.title) {
                    const header = document.createElement('div');
                    header.style.cssText = 'grid-column: 1 / -1; font-weight: bold; font-size: 18px; color: var(--accent); padding-top: 15px; padding-bottom: 5px; border-bottom: 1px solid var(--border); text-align: left; margin-bottom: 10px; width: 100%;';
                    header.innerText = section.title;
                    grid.appendChild(header);
                }

                section.chords.forEach((chord) => {
                    const itemWrapper = document.createElement('div');
                    itemWrapper.style.cssText = 'display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 150px; gap: 5px;';

                    const titleLabel = document.createElement('div');
                    titleLabel.style.cssText = 'font-weight: bold; font-size: 16px; text-align: center;';
                    const displayVariant = chord.variant === 'major' ? '' : chord.variant;
                    titleLabel.innerText = `${chord.root} ${displayVariant}`.trim();

                    const chartDiv = document.createElement('div');
                    chartDiv.style.cssText = 'width: 100%; height: 160px;';

                    itemWrapper.appendChild(titleLabel);
                    itemWrapper.appendChild(chartDiv);
                    grid.appendChild(itemWrapper);

                    const miniChart = new window.svguitar.SVGuitarChord(chartDiv);
                    miniChart.chord({
                        fingers: chord.fingers,
                        barres: [],
                        position: chord.baseFret
                    })
                        .configure({
                            color: currentThemeColor,
                            nutColor: currentThemeColor,
                            stringColor: currentThemeColor,
                            fretColor: currentThemeColor
                        })
                        .draw();
                });
            });
        }

        // --- INITIALIZATION ---
        window.onload = loadChordDatabase;
    </script>
</body>
</html>
